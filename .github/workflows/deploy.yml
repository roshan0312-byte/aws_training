name: Deploy Spring Boot to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Project
        run: ./mvnw clean package

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/aws-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu"
          overwrite: true

      - name: Verify JAR on EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Checking JAR..."
            ls -lh /home/ubuntu/aws-0.0.1-SNAPSHOT.jar

      - name: Restart Spring Boot Application
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Stopping existing application..."

            PIDS=$(pgrep -f "aws-0.0.1-SNAPSHOT.jar" || true)

            if [ -n "$PIDS" ]; then
              echo "Found PID(s): $PIDS"

              for PID in $PIDS
              do
                echo "Stopping PID: $PID"
                kill -15 $PID || true
              done

              sleep 10
            else
              echo "No running application found"
            fi

            echo "Starting new application..."

            nohup java -jar /home/ubuntu/aws-0.0.1-SNAPSHOT.jar \
            > /home/ubuntu/app.log 2>&1 < /dev/null &

            sleep 15

            echo "Checking running process..."
            pgrep -af java || true

            echo "Application logs:"
            tail -50 /home/ubuntu/app.log || true

            echo "Deployment Successful"