name: Deploy Spring Boot to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Project
        run: ./mvnw clean package

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/aws-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/aws-0.0.1-SNAPSHOT.jar"

      - name: Verify JAR on EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Checking deployed JAR..."
            ls -lh /home/ubuntu/aws-0.0.1-SNAPSHOT.jar

      - name: Restart Spring Boot Application
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Stopping old application..."

            PID=$(pgrep -f "aws-0.0.1-SNAPSHOT.jar" || true)

            if [ -n "$PID" ]; then
              echo "Killing PID: $PID"
              kill -15 $PID || true
              sleep 10
            else
              echo "No running application found"
            fi

            echo "Starting new application..."

            nohup java -jar /home/ubuntu/aws-0.0.1-SNAPSHOT.jar > /home/ubuntu/app.log 2>&1 &

            sleep 10

            echo "Checking application..."

            pgrep -af java || true

            echo "Application logs:"
            tail -30 /home/ubuntu/app.log || true

            echo "Deployment Successful"