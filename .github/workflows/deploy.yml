name: Deploy Spring Boot to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Project
        run: ./mvnw clean package

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/aws-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu"
          overwrite: true

      - name: Restart Spring Boot Application
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Checking JAR"

            ls -lh /home/ubuntu/aws-0.0.1-SNAPSHOT.jar

            echo "Stopping old application"

            OLD_PID=$(pgrep -f aws-0.0.1-SNAPSHOT.jar || true)

            if [ ! -z "$OLD_PID" ]; then
              echo "Old PID: $OLD_PID"

              nohup bash -c "sleep 2; kill -9 $OLD_PID" >/dev/null 2>&1 &
            
              sleep 5
            fi

            echo "Starting new application"

            cd /home/ubuntu

            nohup java -jar aws-0.0.1-SNAPSHOT.jar > app.log 2>&1 &

            sleep 15

            echo "Checking process"

            pgrep -af java || true

            echo "Logs"

            tail -50 app.log || true

            echo "Deployment Successful"