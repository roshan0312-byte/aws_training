name: Deploy Spring Boot to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Project
        run: ./mvnw clean package

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          target: "/home/ubuntu"

      - name: Restart Spring Boot Application
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            APP_PID=$(pgrep -f "aws-0.0.1-SNAPSHOT.jar" || true)

            if [ -n "$APP_PID" ]; then
              echo "Stopping existing application (PID: $APP_PID)"
              kill -15 $APP_PID
              sleep 5
            fi

            cd /home/ubuntu

            JAR=$(ls *.jar | head -n 1)

            echo "Starting $JAR"

            nohup java -jar "$JAR" > app.log 2>&1 < /dev/null &

            sleep 5

            pgrep -f "$JAR"

            echo "Deployment Successful"